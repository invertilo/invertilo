<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="invertilo  askforvini">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12110E"/>
      <stop offset="55%" stop-color="#1C1A16"/>
      <stop offset="100%" stop-color="#162536"/>
    </linearGradient>
    <linearGradient id="wash" x1="0%" y1="50%" x2="100%" y2="50%">
