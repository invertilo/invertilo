      <stop offset="35%" stop-color="#3A6EA5"/>
      <stop offset="70%" stop-color="#C4A36A"/>
      <stop offset="100%" stop-color="#C4A36A" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
